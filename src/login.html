<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
        }
        .login-container { max-width: 450px; margin: 20px auto; animation: fadeInUp 0.6s ease-out; }
        .card { border: none; border-radius: 15px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); background: rgba(255, 255, 255, 0.95); }
        .card-header { background: linear-gradient(135deg, #4CAF50, #45a049); color: white; border-radius: 15px 15px 0 0 !important; padding: 25px; text-align: center; }
        .form-control { border-radius: 10px; padding: 12px; }
        .btn-primary { background: linear-gradient(135deg, #4CAF50, #45a049); border: none; border-radius: 10px; padding: 12px; }
        .divider { display: flex; align-items: center; margin: 25px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e1e5e9; }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }
        .back-link { color: white; text-decoration: none; opacity: 0.8; }
        .back-link:hover { opacity: 1; text-decoration: underline; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-user-circle fa-2x mb-2"></i>
                <h3>Welcome Back</h3>
                <p class="mb-0 opacity-75">Sign in to your account</p>
            </div>
            <div class="card-body p-4">
                <form>
                    <div class="mb-4">
                        <label class="form-label fw-bold"><i class="fas fa-envelope me-2"></i>Phone or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" placeholder="Enter phone or email" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold"><i class="fas fa-lock me-2"></i>Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button class="btn btn-primary text-white fw-bold" type="button">Login</button>
                    </div>

                    <div class="text-center">
                        <a href="#" class="text-decoration-none small text-success">Forgot password?</a>
                    </div>

                    <div class="divider"><span class="fw-bold text-muted small">OR</span></div>

                    <div class="text-center">
                        <p class="mb-2 text-muted">Don't have an account?</p>
                        <a href="#" class="btn btn-outline-success w-100">Create New Account</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
