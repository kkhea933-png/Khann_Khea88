<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Shop - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom, #f8f9ff, #e6f0ff);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }

    .login-container {
      max-width: 420px;
      margin: 80px auto;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
      padding: 40px 35px;
    }

    /* Student Shop Header */
    .shop-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .book-icon {
      font-size: 3.2rem;
      margin-bottom: 8px;
    }

    .shop-name {
      font-size: 2.4rem;
      font-weight: 700;
      color: #4a6cf7;
      margin: 0;
    }

    .form-control {
      height: 55px;
      font-size: 1.05rem;
      border-radius: 10px;
      border: 2px solid #d0d9ff;
    }

    .form-control:focus {
      border-color: #4a6cf7;
      box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.15);
    }

    .btn-login {
      background-color: #4a6cf7;
      color: white;
      height: 55px;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 10px;
    }

    .btn-login:hover {
      background-color: #3b5be0;
    }

    .create-btn {
      background-color: #4a6cf7;
      color: white;
      font-weight: 600;
      padding: 13px 30px;
      border-radius: 10px;
      font-size: 1.05rem;
      border: 2px solid #4a6cf7;
    }

    .create-btn:hover {
      background-color: rgb(32, 98, 179);
      color: #4a6cf7;
    }

    .forgot-link {
      color: #4a6cf7;
    }

    .book-logo-container {
      background-color: #2b5aed;
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(43, 90, 237, 0.3);
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card text-center">

      <!-- Student Shop Header -->
      <div class="shop-header">
        <div class="book-logo-container">
          <i class="fas fa-book-open"></i>
        </div>

        <h1 class="shop-name">Student Shop</h1>
      </div>

      <h5 class="mb-4 text-dark fw-medium">Sign in to your account</h5>

      <form action="Homepage.html">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Phone or Email" required>
        </div>

        <div class="mb-4">
          <input type="password" class="form-control" placeholder="Password" required>
        </div>

        <button type="submit" class="btn w-100 btn-login mb-3">
          Log In
        </button>

        <div class="text-center mb-4">
          <a href="#" class="forgot-link text-decoration-none">Forgot password?</a>
        </div>

        <hr class="my-4">

        <div class="text-center">
          <p class="text-muted mb-3">Don't have an account?</p>
          <button   type="button" class="btn create-btn px-5" id="regForm">
            <a href="Rigister.html" class="text-white text-decoration-none"> Create New Account</a>
          </button>
        </div>
      </form>
    </div>

    <!-- Back to Home -->
    <div class="text-center mt-4">
      <a href="Homepage.html" class="text-muted text-decoration-none">
        ← Back to Home
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
