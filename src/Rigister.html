<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account - Book Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background image with overlay for readability */
            background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), 
                        url('https://images.unsplash.com/photo-1456735190827-d1262f71b8a3?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* The Book Logo Style */
        .book-logo-container {
            background-color: #2b5aed;
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(43, 90, 237, 0.3);
        }

        h2 {
            margin: 0 0 25px 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            padding-left: 2px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #e1e8ef;
            border-radius: 8px;
            background-color: #f8fbff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2b5aed;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(43, 90, 237, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 13px;
            background-color: #2b5aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-register:hover {
            background-color: #1a44c9;
            transform: translateY(-1px);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .footer-links a {
            color: #2b5aed;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links .forgot {
            display: block;
            margin-top: 10px;
            color: #999;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="book-logo-container">
            <i class="fas fa-book-open"></i>
        </div>

        <h2>Create New Account</h2>

        <form id="regForm">
            <div class="form-group">
                <label>FullName</label>
                <input type="text" id="name" placeholder="Enter Name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="Password" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn-register"><a href="Homepage.html" class="text-white text-decoration-none">Register</a></button>
        </form>

        <div class="footer-links">
            or <a href="#">Sign up</a>
            <a href="#" class="forgot">forgot password?</a>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const gender = document.getElementById('gender').value;

            if(!gender) {
                alert("Please select your gender.");
                return;
            }

            alert("Welcome to the library, " + name + "!");
            console.log("Form Submitted Successfully.");
        });
    </script>

</body>
</html>
